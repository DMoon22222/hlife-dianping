server:
  port: 8081
spring:
  application:
    name: hmdp
  main:
    banner-mode: console
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC
    username: root
    password: 1234
  redis:
    host: 192.168.100.129
    port: 6380
    password: 123321
    lettuce:
      pool:
        # 秒杀限流会让每个请求先访问 Redis。压测时提高连接池容量，减少应用侧等待连接的排队。
        max-active: 50
        max-idle: 20
        min-idle: 5
        time-between-eviction-runs: 10s

  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: hmdp
    password: hmdp_mq_2026
    virtual-host: /hmdp

    publisher-confirm-type: correlated
    publisher-returns: true

    template:
      mandatory: true

    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20
        concurrency: 2
        max-concurrency: 8
        default-requeue-rejected: false
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
  global-config:
    banner: true
logging:
  level:
    root: warn
    com.hmdp: warn

hmdp:
  instance-id: app-1
  cache:
    shop:
      # 压测对比时可改为 false，关闭 Caffeine 本地缓存，只走 Redis + MySQL。
      local-enabled: true
  id-generator:
    # 同一数据中心内，每个应用实例必须使用不同的 worker-id。
    worker-id: 1
    # 不同机房或逻辑部署区域使用不同的 datacenter-id。
    datacenter-id: 1
  rate-limit:
    enabled: true
    seckill:
      max-count: 300
      window-seconds: 1
  seckill:
    # RabbitMQ 异步下单对比压测开关：
    # true：Redis 预扣后发送 RabbitMQ，接口立即返回；
    # false：Redis 预扣后在接口线程同步写 MySQL，再返回。
    async-enabled: true
